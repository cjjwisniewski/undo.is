<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<!-- Open Graph / Twitter Defaults (per-route titles, descriptions, canonicals in <svelte:head>) -->
	<meta property="og:type" content="website" />
	<meta property="og:site_name" content="undo.is" />
	<meta property="og:image" content="https://www.undo.is/avatar.jpg" />
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:image" content="https://www.undo.is/avatar.jpg" />

	<link rel="icon" type="image/png" href="/favicon.png" />
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
